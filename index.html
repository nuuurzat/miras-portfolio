<!doctype html>
<html lang="kk" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мирас Хамитов — Видеограф / Монтажёр</title>
  <meta name="description" content="Портфолио видеографа и монтажёра: кейсы, партнёры и контакты." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C7F231'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%2317150F'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <a class="logo" href="#hero" data-name></a>
    <nav class="nav" aria-label="Негізгі навигация">
      <a href="#cases" data-i18n="nav.cases">Кейстер</a>
      <a href="#services" data-i18n="nav.services">Қызметтер</a>
      <a href="#about" data-i18n="nav.about">Мен жайлы</a>
      <a href="#contact" data-i18n="nav.contact">Байланыс</a>
    </nav>
    <div class="header-tools">
      <div class="lang-switch" role="group" aria-label="Тіл таңдау">
        <button class="lang-btn active" data-lang="kk" type="button">ҚАЗ</button>
        <button class="lang-btn" data-lang="ru" type="button">РУС</button>
        <button class="lang-btn" data-lang="en" type="button">ENG</button>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Түс режимін ауыстыру">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero" id="hero">
      <p class="badge" data-reveal>
        <span class="dot"></span><span data-availability></span>
      </p>
      <h1 class="hero-title" data-reveal style="--d:.05s">
        <span class="hero-name" data-name></span><br />
        <span class="hero-role" data-role></span>
      </h1>
      <p class="hero-intro" data-reveal style="--d:.12s" data-intro></p>
      <div class="hero-actions" data-reveal style="--d:.18s">
        <a class="btn btn-ink" href="#cases" data-i18n="ctaCases">Кейстерді қарау</a>
        <a class="btn btn-accent" href="#contact" data-i18n="ctaContact">Хабарласу</a>
      </div>
      <p class="hero-meta" data-reveal style="--d:.24s"><span data-location></span> · <span data-email></span></p>
      <div class="scroll-hint" aria-hidden="true"><span></span></div>
    </section>

    <!-- COMPANIES MARQUEE -->
    <div class="marquee" aria-label="Серіктес компаниялар">
      <div class="marquee-track" data-marquee></div>
    </div>

    <!-- CASES -->
    <section class="section section-flush" id="cases">
      <div class="section-head" data-reveal>
        <h2 data-i18n="secCases">Кейстер</h2>
        <span class="section-sub">(<span data-cases-count></span>) · <span data-i18n="secYears">2022 — 2025</span></span>
      </div>
      <div class="cases-carousel" data-cases></div>
      <p class="cases-note" data-reveal data-cases-note></p>
    </section>

    <!-- SERVICES -->
    <section class="section" id="services">
      <div class="section-head" data-reveal>
        <h2 data-i18n="secServices">Қызметтер</h2>
      </div>
      <div class="services" data-services></div>
    </section>

    <!-- ABOUT -->
    <section class="section" id="about">
      <div class="section-head" data-reveal>
        <h2 data-i18n="secAbout">Мен жайлы</h2>
      </div>
      <div class="about">
        <p class="about-text" data-reveal data-about></p>
        <div class="stats" data-reveal style="--d:.1s" data-stats></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section contact" id="contact">
      <div class="section-head" data-reveal>
        <h2 data-i18n="secContact">Хабарласу</h2>
      </div>
      <a class="contact-mail" data-reveal href="tel:+77769218632" data-email-link></a>
      <div class="contact-grid" data-contact></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span data-year></span> <span data-name></span> · <span data-i18n="footerRights">Барлық құқықтар қорғалған</span></span>
    <a href="#hero" data-i18n="footerTop">Жоғарыға ↑</a>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
